name: CI Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc make libnetfilter-queue-dev libmnl-dev nftables iptables

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Test Suite with Race Detector
        run: go test -v -race ./tests/...

      - name: Build Binaries
        run: make build

      - name: Build Debian Package
        run: ./packaging/build_deb.sh

      - name: Validate Package Metadata
        run: dpkg-deb --info discord-bypass_1.0.0_amd64.deb
