# discord-bypass Configuration File
# Location: /etc/discord-bypass/config.toml (system-wide) or ./config/config.toml (local)

[general]
# Logging verbosity: "debug", "info", "warn", "error"
log_level = "info"

# Path to the domain allowlist
domains_file = "/etc/discord-bypass/domains.txt"

# Prefer IPv4 for Discord connections.
# This does not disable system IPv6. IPv6 NFQUEUE behavior should be live-tested
# on the target network before enabling it.
prefer_ipv4 = true

# DPI evasion backend:
# "nfqws"   - Linux Netfilter NFQUEUE packet desynchronizer (recommended, high-performance)
# "native"  - Built-in zero-dependency Go transparent TCP splitter
# "byedpi"  - ByeDPI userspace proxy engine
backend = "nfqws"

# Selected strategy:
# "strategy_a" - Direct connection (benchmark baseline)
# "strategy_b" - Secure DNS only (for pure DNS blocking)
# "strategy_c" - TLS SNI split (unverified on a given network until live-tested)
# "strategy_d" - Fake + split (unverified on a given network until live-tested)
strategy = "strategy_c"

[dns]
# DNS resolution mode: "doh" (DNS over HTTPS), "system", "custom"
mode = "doh"

# Upstream DoH provider: "cloudflare", "google", "quad9", or custom HTTPS URL
# "cloudflare" -> https://1.1.1.1/dns-query
# "google"     -> https://dns.google/dns-query
# "quad9"      -> https://dns.quad9.net/dns-query
doh_provider = "cloudflare"

# Custom DNS IP:Port if mode = "custom"
custom_resolver = "1.1.1.1:53"

# Upstream DNS server for non-Discord domains (leave empty to auto-detect router/ISP DNS)
upstream_dns = ""

# How often (in seconds) to re-resolve Discord domains and refresh firewall IP sets
update_interval_sec = 300

# Safely sync Discord domain mappings into /etc/hosts to override ISP DNS poisoning.
# Overrides ISP DNS poisoning directly without touching system-wide DNS servers.
sync_hosts = true

# Local loopback port for the built-in Secure DNS forwarder (0 to disable)
local_dns_port = 0

[firewall]
# Firewall management driver: "auto", "nftables", "iptables"
# "auto" detects nftables first, falling back to iptables.
driver = "auto"

# Name of the dedicated nftables table (never modifies user's existing tables)
table_name = "discord_bypass"

# NFQUEUE queue number for nfqws
queue_num = 200

# Local port for native transparent proxy backend
proxy_port = 10443

# Whether to manage IPv6 firewall rules (only if IPv6 is enabled and routable)
manage_ipv6 = true

# Block UDP port 443 (QUIC) for Discord to force fallback to TLS TCP 443.
# Default is false to avoid disrupting UDP/Voice traffic unless specifically needed.
block_quic = false

[nfqws]
# Path to compiled nfqws binary
binary_path = "/usr/local/bin/discord-bypass-nfqws"

# Live-tested and verified working parameters for Turkcell Superonline & major Turkish ISPs:
# fakedsplit with midsld and TTL=6 evades ISP DPI while expiring before reaching Cloudflare.
strategy_c_args = ["--dpi-desync=fakedsplit", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=6"]
strategy_d_args = ["--dpi-desync=fakeddisorder", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=6"]

[native]
# Split position for native Go transparent proxy (2 = after TLS record version)
split_pos = 2
split_delay_ms = 2

[diagnostics]
# Timeout in seconds for individual diagnostic network probes
timeout_sec = 5

# Probed endpoints for diagnostics
api_endpoint = "https://discord.com/api/v9/gateway"
gateway_endpoint = "wss://gateway.discord.gg"
cdn_endpoint = "https://cdn.discordapp.com"
voice_endpoint = "voice.discord.media:443"
