# Strategy Definitions for discord-bypass
# These strategies represent documented tiers of DPI evasion and candidate variants for automatic tuning.

[strategies.strategy_a]
name = "Direct (Normal Connection)"
description = "Baseline connection with no DPI manipulation. Used to verify whether the ISP is actively filtering Discord."
requires_backend = false
requires_doh = false
nfqws_args = []
native_split = 0

[strategies.strategy_b]
name = "Secure DNS Workaround"
description = "Bypasses DNS-level filtering (UDP port 53 poisoning/hijacking) using DNS over HTTPS (DoH) without packet manipulation."
requires_backend = false
requires_doh = true
nfqws_args = []
native_split = 0

[strategies.strategy_c]
name = "TLS SNI Fake Split (fakedsplit midsld ttl=6)"
description = "Splits the TLS ClientHello at midsld with a TTL=6 fake segment. Verified effective on Turkcell Superonline and major Turkish ISPs."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fakedsplit", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=6"]
native_split = 2

[strategies.strategy_c_ttl5]
name = "TLS SNI Fake Split (fakedsplit midsld ttl=5)"
description = "Splits the TLS ClientHello at midsld with a TTL=5 fake segment. Alternative TTL for shorter ISP transit paths."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fakedsplit", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=5"]
native_split = 2

[strategies.strategy_c_ttl4]
name = "TLS SNI Fake Split (fakedsplit midsld ttl=4)"
description = "Splits the TLS ClientHello at midsld with a TTL=4 fake segment. Effective for low-hop ISP middleboxes."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fakedsplit", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=4"]
native_split = 2

[strategies.strategy_d]
name = "Advanced Out-of-Order Desync (fakeddisorder midsld ttl=6)"
description = "Sends an out-of-order fake TLS segment at midsld with TTL=6. Resilient fallback for stateful middleboxes with aggressive TCP reassembly."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fakeddisorder", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=6"]
native_split = 2

[strategies.strategy_d_ttl5]
name = "Advanced Out-of-Order Desync (fakeddisorder midsld ttl=5)"
description = "Sends an out-of-order fake TLS segment at midsld with TTL=5."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fakeddisorder", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=5"]
native_split = 2

[strategies.strategy_split2]
name = "Standard TCP Segmentation (multisplit split-pos=2)"
description = "Splits the TLS ClientHello at byte 2 without fake packets. Effective against simpler stateless DPIs."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=multisplit", "--dpi-desync-split-pos=2"]
native_split = 2

[strategies.strategy_fake_multisplit]
name = "Full Fake ClientHello + Multisplit (midsld, ttl=5)"
description = "Injects a full fake TLS ClientHello followed by multisplit at midsld with TTL=5."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fake,multisplit", "--dpi-desync-split-pos=midsld", "--dpi-desync-ttl=5"]
native_split = 2
