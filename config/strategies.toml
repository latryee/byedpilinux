# Strategy Definitions for discord-bypass
# These strategies represent documented tiers of DPI evasion.

[strategies.strategy_a]
name = "Direct (Normal Connection)"
description = "Baseline connection with no DPI manipulation. Used to verify whether the ISP is actively filtering Discord."
requires_backend = false
requires_doh = false
nfqws_args = []
native_split = 0

[strategies.strategy_b]
name = "Secure DNS Workaround"
description = "Bypasses DNS-level filtering (UDP port 53 poisoning/hijacking) using DNS over HTTPS (DoH) without packet manipulation."
requires_backend = false
requires_doh = true
nfqws_args = []
native_split = 0

[strategies.strategy_c]
name = "TCP Segmentation (split2)"
description = "Splits the TLS ClientHello into two TCP segments (first segment is 2 bytes). Evades SNI inspection on Türk Telekom, Turkcell, Vodafone, and most middleboxes without relying on TTL estimation."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=split2"]
native_split = 2

[strategies.strategy_d]
name = "Advanced DPI Desynchronization (fake + split2)"
description = "Sends a low-TTL fake TLS ClientHello followed by segmented real ClientHello. Effective against stateful middleboxes that perform partial reassembly."
requires_backend = true
requires_doh = true
nfqws_args = ["--dpi-desync=fake,split2", "--dpi-desync-ttl=4"]
native_split = 2
